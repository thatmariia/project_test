name: Set up Python project
description: Install the selected project manager and all generated dependency groups.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: pyproject.toml
    - name: Install Poetry
      shell: bash
      run: python -m pip install "poetry>=2,<3"
    - name: Install project dependencies
      shell: bash
      run: |
        poetry config virtualenvs.in-project true
        if [[ -f poetry.lock ]]; then
          poetry check --lock
        fi
        poetry install --all-extras
